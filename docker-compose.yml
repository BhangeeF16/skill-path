services:
  neo4j:
    image: neo4j:5.26-community
    container_name: skillpath-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/skillpath-local
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - skillpath-neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "skillpath-local", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  skillpath-neo4j-data:
